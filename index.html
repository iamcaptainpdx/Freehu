<!--
FREEHU setup (free Spark plan, no card)
1. console.firebase.google.com > Add project.
2. Authentication > turn on Google and Anonymous. Authentication > Settings > Authorized domains > add your domain.
3. Firestore Database > Create > Rules > paste:
   rules_version = '2';
   service cloud.firestore { match /databases/{db}/documents {
     match /users/{u} { allow read, write: if request.auth != null && request.auth.uid == u; }
     match /groups/{g} {
       allow read: if request.auth != null;
       allow create: if request.auth != null && request.auth.uid in request.resource.data.members;
       allow update: if request.auth != null && (request.auth.uid in resource.data.members ||
         (request.auth.uid in request.resource.data.members &&
          request.resource.data.members.size() == resource.data.members.size() + 1 &&
          request.resource.data.members.size() <= 30));
       allow delete: if false; } } }
4. Project settings > Your apps > Web > copy config into FIREBASE_CONFIG below.
5. OPTIONAL, Google Calendar import: in Google Cloud Console (same project) enable "Google Calendar API", and on the OAuth consent screen add the scope
   .../auth/calendar.freebusy (it only reads busy/free, never event details).
-->

/* ---- availability (weekly pattern + one-off busy days, in each person's own time) ---- */
function slotOf(m,ts){const L=new Date(ts+(m.z??MYZ)*6e4);let h=L.getUTCHours(),d=(L.getUTCDay()+6)%7,D=L;if(h<6){h+=24;D=new Date(+L-864e5);d=(d+6)%7}return{d,h,k:D.toISOString().slice(0,10)}}
const isFree=(m,ts)=>{const s=slotOf(m,ts);return !!bits(m.a,s.d,s.h)&&!((m.x?.[s.k]>>(s.h-6))&1)};
function eff(m,now=Date.now()){if(m.s&&m.s!='auto'&&m.u>now)return{st:m.s=='free'?'free':'busy',until:m.u,manual:1};
const f=isFree(m,now);let k=1;for(;k<168;k++)if(isFree(m,now+k*36e5)!=f)break;const b=new Date(now);b.setMinutes(0,0,0);return{st:f?'free':'busy',until:k<168?b.getTime()+k*36e5:0}}
const stTxt=e=>e.manual?`${e.st=='free'?'Free':'Busy'} until ${fmtT(e.until)}`:e.st=='free'?(e.until?`Free until ${fmtT(e.until)}`:'Free all week'):(e.until?`Free from ${fmtT(e.until)}`:'No free time set');
const allFree=(m,t,l)=>{for(let j=0;j<l;j++)if(!isFree(m,t+j*36e5))return false;return true};
function best(G,len=2,k=3){const ms=Object.values(G.m||{}),o=[],n0=new Date();n0.setMinutes(0,0,0);const t0=n0.getTime()+36e5;
for(let i=0;i<168;i++){const t=t0+i*36e5,h=new Date(t).getHours();if(h<8||h+len>23)continue;const f=ms.filter(m=>allFree(m,t,len));o.push({t,n:f.length,f,tot:ms.length,pr:Math.abs(h-18)})}
o.sort((a,b)=>b.n-a.n||a.pr-b.pr||a.t-b.t);const r=[],seen={};for(const w of o){if(w.n<2&&w.tot>1)break;const d=dk(w.t);if((seen[d]||0)>=1)continue;seen[d]=1;r.push(w);if(r.length==k)break}return r}

watchUser:(u,cb)=>F.onSnapshot(F.doc(db,'users',u),s=>cb(s.exists()?s.data():null)),saveUser:(u,d)=>F.setDoc(F.doc(db,'users',u),d,{merge:true}),
