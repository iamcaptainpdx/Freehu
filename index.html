<!--
FREEHU: setup in 5 steps (all free, no card needed)
1. console.firebase.google.com > Add project (stay on the free Spark plan).
2. Build > Authentication > Get started > turn on Google and Anonymous.
3. Build > Firestore Database > Create (production mode) > Rules tab > paste:
   rules_version = '2';
   service cloud.firestore { match /databases/{db}/documents {
     match /users/{u} { allow read, write: if request.auth != null && request.auth.uid == u; }
     match /groups/{g} {
       allow read: if request.auth != null;
       allow create: if request.auth != null && request.auth.uid in request.resource.data.members;
       allow update: if request.auth != null && (request.auth.uid in resource.data.members ||
         (request.auth.uid in request.resource.data.members &&
          request.resource.data.members.size() == resource.data.members.size() + 1 &&
          request.resource.data.members.size() <= 30));
       allow delete: if false; } } }
4. Project settings > Your apps > Web (</>) > copy the config into FIREBASE_CONFIG below.
5. Authentication > Settings > Authorized domains > add your domain.
Then upload this file as index.html to GitHub (Cloudflare Pages publishes it).
-->
