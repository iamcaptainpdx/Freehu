<!DOCTYPE html>
<!--
FREEHU setup (free Spark plan, no card)
1. console.firebase.google.com > Add project.
2. Authentication > turn on Google and Anonymous. Authentication > Settings > Authorized domains > add your domain.
3. Firestore Database > Create > Rules > paste (replaces any older rules, then Publish):
   rules_version = '2';
   service cloud.firestore { match /databases/{db}/documents {
     match /users/{u} { allow read, write: if request.auth != null && request.auth.uid == u; }
     match /usernames/{n} { allow get: if request.auth != null;
       allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
       allow delete: if request.auth != null && resource.data.uid == request.auth.uid; }
     match /groups/{g} {
       // get only: nobody can list or scan groups, you need the 6-letter code
       allow get: if request.auth != null;
       allow create: if request.auth != null && request.resource.data.members == [request.auth.uid]
         && request.resource.data.owner == request.auth.uid;
       allow update: if request.auth != null && (
         // joining: add yourself (max 30) and write only your own entry
         ( !(request.auth.uid in resource.data.members)
           && request.auth.uid in request.resource.data.members
           && request.resource.data.members.size() == resource.data.members.size() + 1
           && request.resource.data.members.size() <= 30
           && request.resource.data.members.hasAll(resource.data.members)
           && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['members','m'])
           && request.resource.data.m.diff(resource.data.m).affectedKeys().hasOnly([request.auth.uid]) )
         // members: edit only your own entry, plans, or remove yourself
         || ( request.auth.uid in resource.data.members
           && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['members','m','p'])
           && request.resource.data.m.diff(resource.data.m).affectedKeys().hasOnly([request.auth.uid])
           && ( request.resource.data.members == resource.data.members
             || ( request.resource.data.members.size() == resource.data.members.size() - 1
               && !(request.auth.uid in request.resource.data.members)
               && resource.data.members.hasAll(request.resource.data.members) ) ) )
         // owner only: set the group time zone
         || ( request.auth.uid == resource.data.owner
           && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['gz']) ) );
       allow delete: if false; } } }
4. Project settings > Your apps > Web > copy config into FIREBASE_CONFIG below.
4b. OPTIONAL analytics: add your Web app's measurementId ("G-XXXX") to FIREBASE_CONFIG and enable Google Analytics for the project.
5. OPTIONAL, Google Calendar import: in Google Cloud Console (same project) enable "Google Calendar API", and on the OAuth consent screen add the scope
   .../auth/calendar.freebusy (it only reads busy/free, never event details).
-->

<style>
/* ===== Freehu design system: one layer, one accent, flat surfaces ===== */
:root{--bg:#f6f6fa;--card:#fff;--ink:#16161f;--mut:#6a6a7a;--line:#e6e6ee;--fill:#f0f0f6;--acc:#5b4bdb;--accsoft:#5b4bdb14;--ok:#22b35e;--okink:#0f7a3d;--okbg:#22b35e1f;--bad:#e5484d;--r:16px;color-scheme:light}

/* layout */

document.addEventListener('change',e=>{const f=e.target.classList.contains('pfile')&&e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);ui.ph=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(u);render()};im.src=u});

(async()=>{render();try{store=await fbStore(FIREBASE_CONFIG)}catch(e){console.error(e);document.getElementById('app').innerHTML='<main><div class="empty"><b>Can’t connect</b><p class="mut">Check your internet and the Firebase config, then reload.</p><p><small>Details: '+esc(e&&(e.code||e.message)||e)+'</small></p><p><small>Open this page from your real website (https), not from a preview or a file on your computer.</small></p></div></main>';return}
store.onAuth(u=>{if(unsubU){unsubU();unsubU=null}if(!u){S.authed=false;S.uid=null;S.me=null;render();return}
S.authed=true;S.uid=u.uid;S.anon=u.anon;

S.me=d;if(!ui.ob&&!d.ob&&!(d.av||[]).some(x=>x)&&!(d.gl||[]).length)ui.ob={step:0,picks:[]};sync();render();autoJoin();if(!d.tz&&!S.tzs){S.tzs=1;saveTz(DEVTZ).catch(()=>{})}if(!S.hb){S.hb=1;beat()}})});
